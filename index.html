{"globalManual":"이곳은 전역 메뉴얼 자리입니다.\n텍스트만 입력 가능하며, 이미지/표/참조는 불가능합니다.","menu":[{"title":"참조","content":"하위 항목 제목은 **참조변수명**, 내용은 **참조변수**입니다.\n다른 항목에서 {{참조변수명}}을 직접 작성하거나, 마우스 우클릭에서 선택할 수 있습니다.\n","tables":[],"children":[{"title":"*수정 모드에서 보이는 이름*","content":"*읽기 모드에서 실제로 표시되는 내용*\n","tables":[{"rows":1,"cols":3,"cells":[["표, 이미지, 표 안에 있는 이미지, \n동시에도 전부 가능.","",""]],"cellColors":[["blue","",""]],"cellMerges":{},"cellImages":[[[],[{"id":"image_1782449344713_8ijxy1","url":"https://www.siheung.go.kr/common/img/common/em_popup.png","width":100,"offset":0}],[{"id":"image_1782449438697_m24dql","url":"https://mblogthumb-phinf.pstatic.net/MjAyMDAyMjFfMTkw/MDAxNTgyMjYzNTQ1Mzg2.asCt2eUdz3Eb9tdI4rls0jWr_vcAwpYLJc7_jZeTfdwg.0zKvLuMCXR3qhYEDr5B_qAlCjKYzq7s2u_u5R1w9MqYg.JPEG.siheungblog/%EC%B0%A8%EB%9F%89%EB%93%B1%EB%A1%9D%EC%82%AC%EC%97%85%EC%86%8C_%EC%9D%B4%EC%A0%84.jpg?type=w800","width":92.9,"offset":0}]]]}],"children":[],"images":[]}],"isReferenceSection":true,"images":[]},{"title":"◉ 메뉴얼 설명","content":"*2026년 06월 26일 42번째 업데이트 -김태영-*\n**메뉴얼 사용 안내**\n메뉴얼은 **좌측***(모바일에서는 최상단)*의 **전역 메뉴얼**과 \n**우측***(모바일에서는 하단)*의 **계층 메뉴얼**로 나뉩니다.\n\n**1. 읽기 모드 / 수정 모드**\n읽기 모드에서는 수정이 불가능하며 열람만 가능합니다.\n읽기 모드에서 이미지는 더블 클릭*(빠르게 마우스 좌측 버튼 2번 클릭)*하여 확대 가능합니다.\n좌측 상단 ☰ 메뉴에서 [📝 수정 모드 켜기]를 누르면 내용을 직접 편집할 수 있습니다.\n수정이 끝나면 [👀 수정 모드 끄기]로 돌아가 읽기 화면을 확인하세요.\n수정모드에서는 ctrl + z 키를 통해 수정한 내용을 되돌릴 수 있습니다.\n\n**2. 내용·항목 편집**\n제목 수정, 표 추가, 하위 항목 추가, 삭제를 사용할 수 있습니다.\n수정 모드에서는 헤더를 길게 눌러 드래그할 수 있습니다.\n대상 헤더의 위/중간/아래 영역에 놓아 앞·하위·뒤 위치로 이동합니다.\n중간 영역에 잠시 머무르면 하위 항목을 펼쳐 그 안으로 이동할 수 있습니다.\n표에 대한 설명은 하단의 표를 참고해주세요.\n\n**3. 본문 편집**\n본문에는 텍스트, 이미지, 참조가 가능합니다.\n텍스트는 평범하게 입력하면 되고,  이미지는 이미지를 놓을 곳에 커서를 둔 후,\n우클릭 하여 이미지 추가를 눌러 이미지 주소를 입력하세요.\n참조는 참조를 놓을 곳에 커서를 둔 후 우클릭 하여 원하는 참조변수 이름을 선택하면 됩니다.\n수정 모드에선 {{참조변수 이름}}으로 표시됩니다.\n참조를 통해 표, 본문, 이미지 등을 한번에 불러 올 수 있습니다.\n반복되는 것은 참조를 적극 활용하는 것이 좋습니다.\n\n**4. 강조 표시**\n∗∗로 문자를 감싸면 **굵고 푸르게 표시** 합니다.\n∗로 문자를 감싸면 *흐리고 얇게* 표시합니다.\n*∗는 일반적으로 키보드의 숫자 8 위에 있습니다.*\n\n**5. 검색**\n메뉴얼 이름 옆 검색창에서 검색어를 const REFERENCE_SECTION_CONTENT = '하위 항목 제목은 참조변수명, 내용은 참조변수입니다.\n다른 항목에서 {{참조변수명}} 형식으로 불러올 수 있습니다.';

// ==================== LocalStorage ====================
function getStorageKeyFromHash() {
  const rawHash = window.location.hash.slice(1);
  if (!rawHash) return '';

  try {
    return decodeURIComponent(rawHash);
  } catch (err) {
    return rawHash;
  }
}

function setStorageKeyHash(key) {
  if (!key) return;
  const encodedKey = encodeURIComponent(key);
  if (window.location.hash.slice(1) !== encodedKey) {
    history.replaceState(null, '', `#${encodedKey}`);
  }
}

function getLocalStorageKeys() {
  return Array.from({ length: localStorage.length }, (_, index) => localStorage.key(index))
    .filter(Boolean)
    .filter(isValidManualStorageKey)
    .sort((a, b) => a.localeCompare(b, 'ko'));
}

function isManualDataShape(data) {
  return data && typeof data === 'object' && Array.isArray(data.menu);
}

function getManualName() { return String(manualData.manualName || '').trim() || DEFAULT_MANUAL_NAME; }
function getSafeManualName() { return getManualName().replace(/[\\/:*?"<>|]/g, '_').trim() || '메뉴얼'; }
function getStorageKeyForManualName() { return `manualData(${getManualName()})`; }
function renameActiveStorageKeyForManualName() {
  if (saveTimer) {
    clearTimeout(saveTimer);
    saveTimer = null;
  }
  const nextKey = getStorageKeyForManualName();
  if (nextKey === activeStorageKey) return true;
  if (localStorage.getItem(nextKey) !== null) { alert(`'${nextKey}' key가 이미 존재합니다.`); return false; }
  localStorage.setItem(nextKey, JSON.stringify(manualData));
  localStorage.removeItem(activeStorageKey);
  activeStorageKey = nextKey;
  setStorageKeyHash(activeStorageKey);
  refreshStorageKeyMenu();
  return true;
}

function isValidManualStorageKey(key) {
  try {
    const saved = localStorage.getItem(key);
    return Boolean(saved) && isManualDataShape(JSON.parse(saved));
  } catch (err) {
    return false;
  }
}

function updateActiveStorageKeyLabel() {
  const label = document.getElementById('active-storage-key');
  if (!label) return;
  label.textContent = `현재 작업 메뉴얼: ${getManualName()}`;
}

function getStorageKeyDisplayName(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key));
    const name = String(data?.manualName || '').trim();
    if (name) return name;
  } catch (err) {
    // 목록에는 유효한 메뉴얼 데이터만 포함되므로 표시 이름만 기본값으로 처리합니다.
  }
  const match = key.match(/^manualData\((.*)\)$/);
  return match?.[1]?.trim() || '이름 없는 메뉴얼';
}

function refreshStorageKeyMenu() {
  const select = document.getElementById('storage-key-select');
  if (!select) return;

  const keys = getLocalStorageKeys();
  if (isValidManualStorageKey(activeStorageKey) && !keys.includes(activeStorageKey)) {
    keys.unshift(activeStorageKey);
  }

  select.replaceChildren();
  keys.forEach(key => {
    const option = document.createElement('option');
    option.value = key;
    option.textContent = getStorageKeyDisplayName(key);
    option.title = `저장 ID: ${key}`;
    option.selected = key === activeStorageKey;
    select.appendChild(option);
  });

  updateActiveStorageKeyLabel();
}

function selectStorageKey(key) {
  if (!key || key === activeStorageKey) return;

  saveToLocalStorage(true);
  const previousKey = activeStorageKey;
  activeStorageKey = key;
  setStorageKeyHash(activeStorageKey);

  try {
    loadFromLocalStorage();
    resetEditHistory();
    renderAll();
    refreshStorageKeyMenu();
  } catch (err) {
    activeStorageKey = previousKey;
    setStorageKeyHash(activeStorageKey);
    refreshStorageKeyMenu();
    alert('선택한 key의 데이터가 메뉴얼 형식이 아닙니다.');
  }
}

function createStorageKey() {
  const rawName = prompt(
    '새 메뉴얼의 이름을 입력하세요.\n현재 메뉴얼 내용이 복사되어 별도 작업본으로 저장됩니다.',
    getManualName()
  );
  if (rawName === null) return;

  const newName = rawName.trim();
  if (!newName) {
    alert('메뉴얼 이름을 입력해야 합니다.');
    return;
  }
  const newKey = `manualData(${newName})`;

  if (localStorage.getItem(newKey) !== null) {
    alert('같은 이름의 메뉴얼이 이미 있습니다. 다른 이름을 입력하세요.');
    return;
  }

  activeStorageKey = newKey;
  manualData.manualName = newName;
  setStorageKeyHash(activeStorageKey);
  saveToLocalStorage(true);
  resetEditHistory();
  renderAll();
  refreshStorageKeyMenu();
  alert(`'${newName}' 메뉴얼 복사본을 만들었습니다.`);
}

const SAVE_DEBOUNCE_DELAY = 400;
let saveTimer = null;
const EDIT_HISTORY_LIMIT = 100;
const editHistoryState = { undoStack: [], currentSnapshot: null };

function resetEditHistory() {
  editHistoryState.undoStack = [];
  editHistoryState.currentSnapshot = JSON.stringify(manualData);
}

function recordEditHistory() {
  const snapshot = JSON.stringify(manualData);
  if (editHistoryState.currentSnapshot === null) {
    editHistoryState.currentSnapshot = snapshot;
    return;
  }
  if (snapshot === editHistoryState.currentSnapshot) return;

  editHistoryState.undoStack.push(editHistoryState.currentSnapshot);
  if (editHistoryState.undoStack.length > EDIT_HISTORY_LIMIT) editHistoryState.undoStack.shift();
  editHistoryState.currentSnapshot = snapshot;
}

function saveToLocalStorage(immediately = false) {
  manualData.manualName = getManualName();
  const storageKey = activeStorageKey;
  const save = () => {
    manualData.manualName = getManualName();
    recordEditHistory();
    localStorage.setItem(storageKey, JSON.stringify(manualData));
    saveTimer = null;
    refreshStorageKeyMenu();
  };
  if (saveTimer) clearTimeout(saveTimer);
  if (immediately) save();
  else saveTimer = setTimeout(save, SAVE_DEBOUNCE_DELAY);
}

function loadFromLocalStorage() {
  const saved = localStorage.getItem(activeStorageKey);
  if (!saved) {
    throw new Error('Storage key not found');
  }

  const parsedData = JSON.parse(saved);
  if (!isManualDataShape(parsedData)) {
    throw new Error('Invalid manual data');
  }
  manualData = parsedData;
}

// ==================== 마크다운 처리 ====================
function escapeHtml(unsafe) {
  return unsafe
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function markdownToHtml(text, seenReferences = new Set()) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^\*]+?)\*/g, '<em>$1</em>');
  html = html.split('\n').map(line => {
    const trimmed = line.trimStart();
    if (/^\d+\.\s/.test(trimmed)) {
      return `<span style="display:block; margin:6px 0 6px 16px;">${trimmed}</span>`;
    }
    return line;
  }).join('<br>');
  return replaceReferenceTokens(html, seenReferences);
}

function isReferenceSection(item) {
  return Boolean(item?.isReferenceSection) || item?.title === REFERENCE_SECTION_TITLE;
}

function isReferenceRootPath(path) {
  return path.length === 1 && isReferenceSection(manualData.menu?.[path[0]]);
}

function isReferenceEntryPath(path) {
  return path.length === 2 && isReferenceRootPath([path[0]]);
}

function isDescriptionSection(item) {
  return Boolean(item?.isDescriptionSection);
}

function isDescriptionSectionPath(path) {
  return path.length > 0 && isDescriptionSection(manualData.menu?.[path[0]]);
}

function ensureReferenceSection() {
  if (!manualData || typeof manualData !== 'object') manualData = {};
  if (!Array.isArray(manualData.menu)) manualData.menu = [];

  let referenceIndex = manualData.menu.findIndex(isReferenceSection);
  if (referenceIndex === -1) {
    manualData.menu.unshift({
      title: REFERENCE_SECTION_TITLE,
      content: REFERENCE_SECTION_CONTENT,
      tables: [],
      children: [],
      isReferenceSection: true
    });
    referenceIndex = 0;
  }

  const referenceItem = manualData.menu[referenceIndex];
  referenceItem.title = REFERENCE_SECTION_TITLE;
  referenceItem.isReferenceSection = true;
  if (!referenceItem.content) referenceItem.content = REFERENCE_SECTION_CONTENT;
  referenceItem.tables = [];
  if (!Array.isArray(referenceItem.children)) referenceItem.children = [];
  referenceItem.children.forEach(child => {
    if (!Array.isArray(child.tables)) child.tables = [];
    child.children = [];
  });

  if (referenceIndex > 0) {
    manualData.menu.splice(referenceIndex, 1);
    manualData.menu.unshift(referenceItem);
  }
}

function ensureDescriptionSection() {
  if (!Array.isArray(manualData.menu)) return;
  if (manualData.menu.some(isDescriptionSection)) return;
  if (manualData.descriptionSectionMigrated) return;

  const firstContentItem = manualData.menu.find(item => !isReferenceSection(item));
  if (firstContentItem) firstContentItem.isDescriptionSection = true;
  manualData.descriptionSectionMigrated = true;
}

function ensureSystemSections() {
  ensureReferenceSection();
  ensureDescriptionSection();
  normalizeAllImages();
}

function getReferenceMap() {
  ensureSystemSections();
  const referenceItem = manualData.menu[0];
  const map = new Map();
  referenceItem.children.forEach(child => {
    const key = String(child.title || '').trim();
    if (key) map.set(key, child);
  });
  return map;
}

function contentWithImagesToHtml(text, images, seenReferences = new Set()) {
  const source = String(text || '');
  const ordered = [...(Array.isArray(images) ? images : [])].sort((a, b) => Number(a.offset) - Number(b.offset));
  let cursor = 0;
  const parts = [];
  ordered.forEach(image => {
    const offset = Math.min(source.length, Math.max(cursor, Number(image.offset) || 0));
    parts.push(markdownToHtml(source.slice(cursor, offset), seenReferences));
    const url = escapeHtml(String(image.url || ''));
    const width = Math.max(10, Math.min(100, Number(image.width) || 65));
    parts.push(`<div class="embedded-image-wrap" style="--image-width:${width}%"><img class="embedded-image" src="${url}" alt="" draggable="false"><span class="embedded-image-fallback" hidden>[이미지 링크]</span></div>`);
    cursor = offset;
  });
  parts.push(markdownToHtml(source.slice(cursor), seenReferences));
  return parts.join('');
}

function tableToHtml(table, seenReferences = new Set()) {
  normalizeTable(table);
  const spannedCells = new Set();
  const rows = table.cells.map((row, rowIndex) => {
    const cells = row.map((cellText, colIndex) => {
      if (spannedCells.has(getTableCellKey(rowIndex, colIndex))) return '';

      const span = getTableCellSpan(table, rowIndex, colIndex);
      const color = table.cellColors[rowIndex][colIndex];
      const classes = color ? ` class="cell-color-${color}"` : '';
      const rowspan = span.rowspan > 1 ? ` rowspan="${span.rowspan}"` : '';
      const colspan = span.colspan > 1 ? ` colspan="${span.colspan}"` : '';
      const coveredRows = Math.min(span.rowspan, table.rows - rowIndex);
      const coveredCols = Math.min(span.colspan, table.cols - colIndex);

      for (let rowOffset = 0; rowOffset < coveredRows; rowOffset++) {
        for (let colOffset = 0; colOffset < coveredCols; colOffset++) {
          if (rowOffset === 0 && colOffset === 0) continue;
          spannedCells.add(getTableCellKey(rowIndex + rowOffset, colIndex + colOffset));
        }
      }

      return `<td${classes}${rowspan}${colspan}>${contentWithImagesToHtml(cellText, table.cellImages[rowIndex][colIndex], seenReferences)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  return `<div class="manual-table-wrap"><table class="manual-table">${rows}</table></div>`;
}

function renderReferenceHtml(referenceName, seenReferences = new Set()) {
  const name = referenceName.trim();
  const reference = getReferenceMap().get(name);

  if (!reference) {
    return `<span class="reference-missing">{{${escapeHtml(name)}}}</span>`;
  }

  if (seenReferences.has(name)) {
    return `<span class="reference-missing">{{${escapeHtml(name)}} 순환 참조}}</span>`;
  }

  seenReferences.add(name);
  const parts = [];
  const content = String(reference.content || '');
  const referenceImages = ensureItemImages(reference);
  if (content.trim() || referenceImages.length) parts.push(contentWithImagesToHtml(content, referenceImages, seenReferences));
  ensureItemTables(reference).forEach(table => parts.push(tableToHtml(table, seenReferences)));
  seenReferences.delete(name);
  return parts.join('');
}

function replaceReferenceTokens(html, seenReferences = new Set()) {
  return html.replace(/{{\s*([^{}]+?)\s*}}/g, (match, referenceName) => {
    return renderReferenceHtml(referenceName, seenReferences);
  });
}

const referenceAutocompleteState = {
  editor: null,
  query: '',
  tokenStart: -1,
  caretOffset: 0,
  names: [],
  activeIndex: 0
};

function getReferenceNames() {
  return Array.from(getReferenceMap().keys()).sort((a, b) => a.localeCompare(b, 'ko'));
}

function getOrCreateReferenceAutocomplete() {
  let popup = document.getElementById('reference-autocomplete');
  if (popup) return popup;

  popup = document.createElement('div');
  popup.id = 'reference-autocomplete';
  popup.className = 'reference-autocomplete';
  popup.hidden = true;
  popup.addEventListener('mousedown', event => {
    if (event.target.closest?.('select')) return;
    event.preventDefault();
  });
  document.body.appendChild(popup);
  return popup;
}

function getCaretTextOffset(element) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return 0;

  const range = selection.getRangeAt(0);
  if (!element.contains(range.endContainer)) return 0;

  const beforeRange = range.cloneRange();
  beforeRange.selectNodeContents(element);
  beforeRange.setEnd(range.endContainer, range.endOffset);
  return beforeRange.toString().length;
}

function setCaretTextOffset(element, offset) {
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
  let remaining = offset;
  let node = walker.nextNode();

  while (node) {
    if (remaining <= node.textContent.length) {
      const range = document.createRange();
      range.setStart(node, remaining);
      range.collapse(true);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      return;
    }
    remaining -= node.textContent.length;
    node = walker.nextNode();
  }

  const range = document.createRange();
  range.selectNodeContents(element);
  range.collapse(false);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
}

function getEditableText(element) {
  return element?.textContent || '';
}

function getTextNodePositionAtOffset(element, offset) {
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
  let remaining = Math.max(0, offset);
  let node = walker.nextNode();
  let lastNode = null;

  while (node) {
    lastNode = node;
    if (remaining <= node.textContent.length) return { node, offset: remaining };
    remaining -= node.textContent.length;
    node = walker.nextNode();
  }

  if (lastNode) return { node: lastNode, offset: lastNode.textContent.length };
  return null;
}

function getTextRangeByOffsets(element, startOffset, endOffset) {
  const start = getTextNodePositionAtOffset(element, startOffset);
  const end = getTextNodePositionAtOffset(element, endOffset);
  if (!start || !end) return null;

  const range = document.createRange();
  range.setStart(start.node, start.offset);
  range.setEnd(end.node, end.offset);
  return range;
}

function getReferenceAutocompleteMatch(editor) {
  const text = getEditableText(editor);
  const caretOffset = getCaretTextOffset(editor);
  const beforeCaret = text.slice(0, caretOffset);
  const match = beforeCaret.match(/{{([^{}\n]*)$/);
  if (!match) return null;

  return {
    query: match[1],
    tokenStart: caretOffset - match[0].length,
    caretOffset
  };
}

function getReferenceAutocompleteReplacementRange(editor) {
  const text = getEditableText(editor);
  const currentMatch = getReferenceAutocompleteMatch(editor);
  const tokenStart = currentMatch?.tokenStart ?? referenceAutocompleteState.tokenStart;
  if (tokenStart < 0 || text.slice(tokenStart, tokenStart + 2) !== '{{') return null;

  const query = currentMatch?.query ?? referenceAutocompleteState.query ?? '';
  let tokenEnd = Math.max(
    currentMatch?.caretOffset ?? 0,
    referenceAutocompleteState.caretOffset,
    tokenStart + 2 + query.length
  );

  const openTokenMatch = text.slice(tokenStart).match(/^{{[^{}\s]*/);
  if (openTokenMatch) {
    tokenEnd = Math.max(tokenEnd, tokenStart + openTokenMatch[0].length);
  }

  return { tokenStart, tokenEnd };
}

function positionReferenceAutocomplete(editor) {
  const popup = getOrCreateReferenceAutocomplete();
  const selection = window.getSelection();
  const range = selection?.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
  const caretRect = range?.getBoundingClientRect();
  const editorRect = editor.getBoundingClientRect();
  const left = Math.min((caretRect?.left || editorRect.left), window.innerWidth - 340);
  const top = (caretRect?.bottom || editorRect.bottom) + 6;

  popup.style.left = `${Math.max(8, left)}px`;
  popup.style.top = `${Math.min(window.innerHeight - 240, Math.max(8, top))}px`;
}

function closeReferenceAutocomplete() {
  const popup = document.getElementById('reference-autocomplete');
  if (popup) popup.hidden = true;
  referenceAutocompleteState.editor = null;
  referenceAutocompleteState.query = '';
  referenceAutocompleteState.tokenStart = -1;
  referenceAutocompleteState.caretOffset = 0;
  referenceAutocompleteState.names = [];
  referenceAutocompleteState.activeIndex = 0;
}

function renderReferenceAutocomplete() {
  const popup = getOrCreateReferenceAutocomplete();
  popup.replaceChildren();

  referenceAutocompleteState.names.forEach((name, index) => {
    const option = document.createElement('button');
    option.type = 'button';
    option.textContent = name;
    option.classList.toggle('active', index === referenceAutocompleteState.activeIndex);
    option.addEventListener('mousedown', (event) => {
      event.preventDefault();
      applyReferenceAutocomplete(name);
    });
    popup.appendChild(option);
  });

  popup.hidden = referenceAutocompleteState.names.length === 0;
  if (!popup.hidden) positionReferenceAutocomplete(referenceAutocompleteState.editor);
}

function updateReferenceAutocomplete(editor) {
  if (currentMode !== 'edit') {
    closeReferenceAutocomplete();
    return;
  }

  const match = getReferenceAutocompleteMatch(editor);
  if (!match) {
    closeReferenceAutocomplete();
    return;
  }

  const query = match.query.trim().toLowerCase();
  const names = getReferenceNames().filter(name => name.toLowerCase().includes(query));
  if (names.length === 0) {
    closeReferenceAutocomplete();
    return;
  }

  const previousQuery = referenceAutocompleteState.query;
  referenceAutocompleteState.editor = editor;
  referenceAutocompleteState.query = match.query;
  referenceAutocompleteState.tokenStart = match.tokenStart;
  referenceAutocompleteState.caretOffset = match.caretOffset;
  referenceAutocompleteState.names = names;
  referenceAutocompleteState.activeIndex = previousQuery === match.query
    ? Math.min(referenceAutocompleteState.activeIndex, names.length - 1)
    : 0;
  renderReferenceAutocomplete();
}

function applyReferenceAutocomplete(name = referenceAutocompleteState.names[referenceAutocompleteState.activeIndex]) {
  const editor = referenceAutocompleteState.editor;
  if (!editor || !name) return;

  const replacementRange = getReferenceAutocompleteReplacementRange(editor);
  if (!replacementRange) return;

  const insertion = `{{${name}}}`;
  const domRange = getTextRangeByOffsets(editor, replacementRange.tokenStart, replacementRange.tokenEnd);
  if (!domRange) return;

  domRange.deleteContents();
  const node = document.createTextNode(insertion);
  domRange.insertNode(node);
  domRange.setStartAfter(node);
  domRange.collapse(true);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(domRange);
  closeReferenceAutocomplete();
  const inputEvent = typeof InputEvent === 'function'
    ? new InputEvent('input', { bubbles: true, inputType: 'insertReplacementText', data: insertion })
    : new Event('input', { bubbles: true });
  editor.dispatchEvent(inputEvent);
}

function handleReferenceAutocompleteKeydown(event) {
  if (referenceAutocompleteState.editor !== event.currentTarget) return;
  if (getOrCreateReferenceAutocomplete().hidden) return;

  if (event.key === 'ArrowDown') {
    event.preventDefault();
    referenceAutocompleteState.activeIndex = (referenceAutocompleteState.activeIndex + 1) % referenceAutocompleteState.names.length;
    renderReferenceAutocomplete();
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    referenceAutocompleteState.activeIndex = (referenceAutocompleteState.activeIndex - 1 + referenceAutocompleteState.names.length) % referenceAutocompleteState.names.length;
    renderReferenceAutocomplete();
  } else if (event.key === 'Enter' || event.key === 'Tab') {
    event.preventDefault();
    applyReferenceAutocomplete();
  } else if (event.key === 'Escape') {
    event.preventDefault();
    closeReferenceAutocomplete();
  }
}

function bindReferenceAutocomplete(editor, onAddImage) {
  editor.addEventListener('dragover', event => event.preventDefault());
  editor.addEventListener('drop', event => event.preventDefault());
  editor.addEventListener('input', () => updateReferenceAutocomplete(editor));
  editor.addEventListener('compositionend', () => updateReferenceAutocomplete(editor));
  editor.addEventListener('paste', () => setTimeout(() => updateReferenceAutocomplete(editor), 0));
  editor.addEventListener('keyup', () => updateReferenceAutocomplete(editor));
  editor.addEventListener('mouseup', () => updateReferenceAutocomplete(editor));
  editor.addEventListener('focus', () => updateReferenceAutocomplete(editor));
  editor.addEventListener('keydown', handleReferenceAutocompleteKeydown);
  editor.addEventListener('keydown', handleEditablePlainEnter);
  editor.addEventListener('contextmenu', event => {
    if (editor.classList.contains('manual-table-cell-text')) return;
    if (onAddImage) event.stopPropagation();
    showReferenceContextMenu(event, editor, onAddImage);
  });
  editor.addEventListener('blur', () => {
    setTimeout(() => {
      if (document.activeElement?.closest?.('#reference-autocomplete')) return;
      closeReferenceAutocomplete();
    }, 120);
  });
}

const referenceContextMenuState = { editor: null, range: null };
function getCaretRangeAtPoint(x, y) {
  if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
  const position = document.caretPositionFromPoint?.(x, y);
  if (!position) return null;
  const range = document.createRange(); range.setStart(position.offsetNode, position.offset); range.collapse(true); return range;
}
function insertReferenceToken(name) {
  const { editor, range } = referenceContextMenuState;
  if (!editor || !range) return;
  const node = document.createTextNode(`{{${name}}}`);
  range.deleteContents(); range.insertNode(node); range.setStartAfter(node); range.collapse(true);
  const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
  closeReferenceAutocomplete(); editor.dispatchEvent(new Event('input', { bubbles: true }));
}

function setContextMenuReferenceRange(editor, event) {

function closeSiblings(contentDiv) {
  const parentContainer = contentDiv.parentElement.parentElement; // accordion-item의 부모 (상위 content 또는 main-accordion)
  
  // 같은 레벨의 모든 accordion-content 찾기

      if (siblingHeader && siblingHeader.classList.contains('accordion-header')) {
        siblingHeader.classList.remove('active');

    }
  });
}

  childContents.forEach(child => {
    child.classList.remove('open');

function getOpenItemRefs() {
  const openItems = [];
  document.querySelectorAll('.accordion-item').forEach(itemEl => {

function findItemPath(targetItem, items = manualData.menu, basePath = []) {
  for (let index = 0; index < items.length; index++) {
    const item = items[index];
    const path = [...basePath, index];
    if (item === targetItem) return path;

    const childPath = findItemPath(targetItem, item.children || [], path);
    if (childPath) return childPath;
  }
  return null;
}

function reopenItemRefs(openItems) {

// 표 생성
function normalizeTable(table) {
  const rowCount = Math.max(Number(table?.rows) || 1, 1);
  const colCount = Math.max(Number(table?.cols) || 1, 1);
  const colors = Array.from({ length: rowCount }, (_, rowIndex) => {
    const sourceRow = Array.isArray(table?.cellColors?.[rowIndex]) ? table.cellColors[rowIndex] : [];
    return Array.from({ length: colCount }, (_, colIndex) => ['blue', 'red', 'green'].includes(sourceRow[colIndex]) ? sourceRow[colIndex] : '');
  });
  const merges = table?.cellMerges && typeof table.cellMerges === 'object' && !Array.isArray(table.cellMerges)
    ? { ...table.cellMerges }
    : {};
  const cells = Array.from({ length: rowCount }, (_, rowIndex) => {
    const sourceRow = Array.isArray(table?.cells?.[rowIndex]) ? table.cells[rowIndex] : [];
    return Array.from({ length: colCount }, (_, colIndex) => {
      const legacy = extractLegacyTableDecorators(sourceRow[colIndex]);
      if (legacy.color) colors[rowIndex][colIndex] ||= legacy.color;
      if (!merges[getTableCellKey(rowIndex, colIndex)] && (legacy.rows > 1 || legacy.cols > 1)) {
        merges[getTableCellKey(rowIndex, colIndex)] = { rows: legacy.rows, cols: legacy.cols };
      }
      return legacy.text;
    });
  });

  table.rows = rowCount;
  table.cols = colCount;
  table.cells = cells;
  table.cellColors = colors;
  table.cellMerges = merges;
  table.cellImages = Array.from({ length: rowCount }, (_, rowIndex) => {
    const sourceRow = Array.isArray(table?.cellImages?.[rowIndex]) ? table.cellImages[rowIndex] : [];
    return Array.from({ length: colCount }, (_, colIndex) => normalizeImageList(sourceRow[colIndex]));
  });
  return table;
}

function normalizeImageList(images) {
  return Array.isArray(images)
    ? images.filter(image => image && typeof image.url === 'string' && image.url.trim()).map(image => ({
        id: typeof image.id === 'string' && image.id ? image.id : `image_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        url: image.url.trim(),
        width: Math.max(10, Math.min(100, Number(image.width) || 65)),
        offset: Number.isFinite(Number(image.offset)) ? Math.max(0, Number(image.offset)) : Number.MAX_SAFE_INTEGER
      }))
    : [];
}

function ensureItemImages(item) {
  item.images = normalizeImageList(item.images);
  return item.images;
}

function normalizeAllImages(items = manualData.menu) {
  if (!Array.isArray(items)) return;
  items.forEach(item => {
    ensureItemImages(item);
    normalizeAllImages(item.children);
  });
  manualData.globalImages = normalizeImageList(manualData.globalImages);
}

  wrap.appendChild(img);
  if (currentMode === 'edit') {

      const editor = wrap.parentElement?.closest('[data-image-editor="true"]');

        image.width = Math.round((nextWidth / parentWidth) * 1000) / 10;
        wrap.style.setProperty('--image-width', `${image.width}%`);
      };
      const end = endEvent => {
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', end);
        handle.removeEventListener('pointercancel', end);
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', end);
        document.removeEventListener('pointercancel', end);
        try { handle.releasePointerCapture?.(endEvent.pointerId); } catch (err) {}

        saveToLocalStorage(true);
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
      document.addEventListener('pointermove', move, { passive: false });
      document.addEventListener('pointerup', end);
      document.addEventListener('pointercancel', end);
    });
    wrap.appendChild(handle);
  }
  return wrap;
}

function appendTextHtml(container, text) {
  if (!text) return;
  const fragment = document.createElement('span');
  fragment.innerHTML = markdownToHtml(text);
  container.append(...fragment.childNodes);
}

function appendEditableMarkdownText(container, text) {
  if (!text) return;
  const pattern = /\*\*[\s\S]+?\*\*|\*[^\*\n]+?\*/g;
  let cursor = 0;
  let match;

  while ((match = pattern.exec(text)) !== null) {
    if (match.index > cursor) container.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    const token = match[0];
    const span = document.createElement('span');
    span.className = token.startsWith('**') ? 'editable-md-strong' : 'editable-md-em';
    span.textContent = token;
    container.appendChild(span);
    cursor = match.index + token.length;
  }

  if (cursor < text.length) container.appendChild(document.createTextNode(text.slice(cursor)));
}

function renderContentWithImages(container, text, images, editable = false) {
  const ordered = [...(Array.isArray(images) ? images : [])].sort((a, b) => a.offset - b.offset);
  let cursor = 0;
  ordered.forEach(image => {
    const offset = Math.min(String(text || '').length, Math.max(cursor, Number(image.offset) || 0));
    const segment = String(text || '').slice(cursor, offset);
    if (editable) appendEditableMarkdownText(container, segment);
    else appendTextHtml(container, segment);
    container.appendChild(createStoredImageElement(image));
    cursor = offset;
  });
  const tail = String(text || '').slice(cursor);
  if (editable) appendEditableMarkdownText(container, tail);
  else appendTextHtml(container, tail);
}

function refreshEditableMarkdown(container, text, images, caretOffset = getCaretTextOffset(container)) {
  container.replaceChildren();
  renderContentWithImages(container, text, images, true);
  setCaretTextOffset(container, Math.min(caretOffset, String(text || '').length));
}

function serializeContentWithImages(editor, images) {
  const byId = new Map((images || []).map(image => [image.id, image]));
  const used = [];
  let text = '';
  const walk = node => {
    if (node.nodeType === Node.TEXT_NODE) { text += node.nodeValue; return; }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    const isBlock = ['DIV', 'P', 'LI'].includes(node.tagName);
    if (isBlock && text && !text.endsWith('\n')) text += '\n';
    if (node.classList.contains('embedded-image-wrap')) {
      const image = byId.get(node.dataset.imageId);
      if (image) { image.offset = text.length; used.push(image); }
      return;
    }
    if (node.tagName === 'BR') { text += '\n'; return; }
    node.childNodes.forEach(walk);
    if (isBlock && node.nextSibling && !text.endsWith('\n')) text += '\n';
  };
  editor.childNodes.forEach(walk);
  return { text, images: used };
}

function insertPlainTextAtSelection(text) {
  const selection = window.getSelection();
  if (!selection?.rangeCount) return;
  const range = selection.getRangeAt(0);
  range.deleteContents();
  const node = document.createTextNode(text);
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
}

function handleEditablePlainEnter(event) {

  event.currentTarget.dispatchEvent(new Event('input', { bubbles: true }));
}

function requestImageUrl(onSubmit) {

}

  const image = { id: `image_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`, url, width: 65, offset: 0 };
  images.push(image);
  const node = createStoredImageElement(image);
  range.collapse(true);
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);

function addItemImage(path, editor) {

    insertImageAtCaret(editor, referenceContextMenuState.range, images, url, () => {

      item.images = saved.images;
      saveToLocalStorage(true);
    });
  });

function addTableCellImage(path, tableIndex, rowIndex, colIndex, editor) {
  requestImageUrl(url => {
    const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
    const images = table.cellImages[rowIndex][colIndex];
    insertImageAtCaret(editor, referenceContextMenuState.range, images, url, () => {
      const saved = serializeContentWithImages(editor, images);
      table.cells[rowIndex][colIndex] = saved.text;
      table.cellImages[rowIndex][colIndex] = saved.images;
      saveToLocalStorage(true);
    });
  });

// 이전 버전 백업의 태그만 메타데이터로 이관한다. 새 입력·렌더링에서는 태그를 사용하지 않는다.
function extractLegacyTableDecorators(cellText) {
  let text = String(cellText ?? '');
  const result = { text, rows: 1, cols: 1, color: '' };
  let match;
  while ((match = text.match(/^\s*<(?:([rc])(\d+)|(tint))>/i))) {
    if (match[3]) result.color ||= 'blue';
    else if (match[1].toLowerCase() === 'r') result.rows = Math.max(Number(match[2]) || 1, 1);
    else result.cols = Math.max(Number(match[2]) || 1, 1);
    text = text.slice(match[0].length);
  }
  result.text = text.replace(/^\s+/, '');
  return result;
}

function getTableCellSpan(table, rowIndex, colIndex) {
  const merge = table.cellMerges?.[getTableCellKey(rowIndex, colIndex)];
  return merge ? { rowspan: merge.rows, colspan: merge.cols } : { rowspan: 1, colspan: 1 };
}

function getTableCellKey(rowIndex, colIndex) {
  return `${rowIndex}:${colIndex}`;
}

function applyTableCellStyle(cell, color = '') {
  ['blue', 'red', 'green'].forEach(name => cell.classList.toggle(`cell-color-${name}`, color === name));
}

function setTableCellColor(path, tableIndex, rowIndex, colIndex, color) {
  const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  table.cellColors[rowIndex][colIndex] = color;
  saveToLocalStorage();
}

function showTableCellContextMenu(event, cell, path, tableIndex, rowIndex, colIndex) {
  if (currentMode !== 'edit') return;

function closeEditorContextMenu() {

}

function closeContextMenusOnOutsidePointer(event) {
  if (event.target.closest?.('#editor-context-menu, #reference-autocomplete')) return;
  closeEditorContextMenu();
  closeReferenceAutocomplete();

const tableSelection = { active: false, path: null, tableIndex: -1, start: null, end: null, cells: [] };
function clearTableSelection() { tableSelection.cells.forEach(cell => cell.classList.remove('cell-selected')); Object.assign(tableSelection, { active:false, path:null, tableIndex:-1, start:null, end:null, cells:[] }); }
function updateTableSelection(cell) {
  if (!tableSelection.start) return;
  const row = Number(cell.dataset.rowIndex), col = Number(cell.dataset.colIndex);
  tableSelection.end = { row, col };
  tableSelection.cells.forEach(item => item.classList.remove('cell-selected'));
  const minRow=Math.min(tableSelection.start.row,row), maxRow=Math.max(tableSelection.start.row,row), minCol=Math.min(tableSelection.start.col,col), maxCol=Math.max(tableSelection.start.col,col);
  const table = cell.closest('.manual-table');
  tableSelection.cells = Array.from(table.querySelectorAll('td')).filter(item => { const r=Number(item.dataset.rowIndex), c=Number(item.dataset.colIndex); const selected=r>=minRow&&r<=maxRow&&c>=minCol&&c<=maxCol; item.classList.toggle('cell-selected',selected); return selected; });
}
function getTableSelectionRange(path, tableIndex) {
  if (tableSelection.path?.join('.') !== path.join('.') || tableSelection.tableIndex !== tableIndex || !tableSelection.start || !tableSelection.end) return null;
  return { row:Math.min(tableSelection.start.row,tableSelection.end.row), col:Math.min(tableSelection.start.col,tableSelection.end.col), rows:Math.abs(tableSelection.start.row-tableSelection.end.row)+1, cols:Math.abs(tableSelection.start.col-tableSelection.end.col)+1 };
}

  const table=normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  table.cellMerges[getTableCellKey(range.row, range.col)] = { rows: range.rows, cols: range.cols };
  clearTableSelection(); saveRenderAndReopen(path);
}

function unmergeTableCell(path, tableIndex, rowIndex, colIndex) {
  const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  delete table.cellMerges[getTableCellKey(rowIndex, colIndex)];
  saveRenderAndReopen(path);
}
function focusTableCell(path, tableIndex, rowIndex, colIndex) {
  requestAnimationFrame(() => {
    const pathKey = path.join('.');
    const itemEl = getAccordionElement(path);
    const cell = itemEl?.querySelector(
      `.manual-table[data-table-index="${tableIndex}"] td[data-row-index="${rowIndex}"][data-col-index="${colIndex}"]`
    );
    if (!cell || currentMode !== 'edit') return;

    cell.focus();
    const range = document.createRange();
    range.selectNodeContents(cell);
    range.collapse(false);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);

function ensureItemTables(item) {
  if (!Array.isArray(item.tables)) item.tables = [];
  item.tables.forEach(normalizeTable);
  return item.tables;
}

function normalizeAllTables(items = manualData.menu) {
  if (!Array.isArray(items)) return;
  items.forEach(item => {
    ensureItemTables(item);
    normalizeAllTables(item.children);
  });
}

function createEmptyTable(rows, cols) {
  return normalizeTable({
    rows,
    cols,
    cells: Array.from({ length: rows }, () => Array.from({ length: cols }, () => ''))
  });
}

function addTable(path) {
  if (isReferenceRootPath(path)) return;
  const rows = Number(prompt("표의 행 개수를 입력하세요.", "3"));
  if (!Number.isInteger(rows) || rows < 1) return;

  const cols = Number(prompt("표의 열 개수를 입력하세요.", "3"));
  if (!Number.isInteger(cols) || cols < 1) return;

  const item = getItemByPath(path);
  ensureItemTables(item).push(createEmptyTable(rows, cols));
  saveRenderAndReopen(path);
}

function deleteTable(path, tableIndex) {
  if (!confirm("이 표를 삭제하시겠습니까?")) return;
  const item = getItemByPath(path);
  ensureItemTables(item).splice(tableIndex, 1);
  saveRenderAndReopen(path);
}

function addTableRow(path, tableIndex) {
  const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  table.cells.push(Array.from({ length: table.cols }, () => ''));
  table.rows += 1;
  saveRenderAndReopen(path);
}

function removeTableRow(path, tableIndex) {
  const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  if (table.rows <= 1) return;
  table.cells.pop();
  table.rows -= 1;
  saveRenderAndReopen(path);
}

function addTableCol(path, tableIndex) {
  const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  table.cells.forEach(row => row.push(''));
  table.cols += 1;
  saveRenderAndReopen(path);
}

function removeTableCol(path, tableIndex) {
  const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  if (table.cols <= 1) return;
  table.cells.forEach(row => row.pop());
  table.cols -= 1;
  saveRenderAndReopen(path);
}

function updateTableCell(path, tableIndex, rowIndex, colIndex, value) {
  const table = normalizeTable(ensureItemTables(getItemByPath(path))[tableIndex]);
  table.cells[rowIndex][colIndex] = value;
  saveToLocalStorage();
}

function moveItemInSameLevel(fromPath, toIndex) {
  const openItems = getOpenItemRefs();
  const parentPath = fromPath.slice(0, -1);
  const fromIndex = fromPath[fromPath.length - 1];
  const targetArray = getItemsArrayByPath(parentPath);

  if (fromIndex === toIndex) return;
  if (toIndex < 0 || toIndex >= targetArray.length) return;

  const [moved] = targetArray.splice(fromIndex, 1);
  targetArray.splice(toIndex, 0, moved);

  saveAndRender(renderAccordion, openItems);
}

function clearDragStyles() {
  if (dragState.element) {
    dragState.element.style.opacity = '';
    dragState.element.style.outline = '';
    dragState.element.style.background = '';
  }
  document.querySelectorAll('.drag-drop-before,.drag-drop-after,.drag-drop-inside').forEach(el => el.classList.remove('drag-drop-before','drag-drop-after','drag-drop-inside'));
}

function clearDragHoverTimer() { if (dragState.hoverTimer) clearTimeout(dragState.hoverTimer); dragState.hoverTimer = null; dragState.hoverTarget = null; }
function setDragDropTarget(element, zone) {
  const header = element.querySelector(':scope > .accordion-header'); if (!header) return;
  const mode = zone === 'middle' ? 'inside' : zone;
  if (dragState.dropTarget?.element === element && dragState.dropTarget.mode === mode) return;
  clearDragHoverTimer(); document.querySelectorAll('.drag-drop-before,.drag-drop-after,.drag-drop-inside').forEach(el => el.classList.remove('drag-drop-before','drag-drop-after','drag-drop-inside'));
  header.classList.add(`drag-drop-${mode}`); dragState.dropTarget = { element, mode };
  if (zone === 'middle') { dragState.hoverTarget = element; dragState.hoverTimer = setTimeout(() => { if (dragState.active && dragState.hoverTarget === element) { header.classList.add('active'); element.querySelector(':scope > .accordion-content')?.classList.add('open'); } }, 700); }
}
function closeOpenAccordionsForSiblingDrop() {
  document.querySelectorAll('.accordion-content.open').forEach(content => content.classList.remove('open'));
  document.querySelectorAll('.accordion-header.active').forEach(header => header.classList.remove('active'));
}
function moveItemToDropTarget(fromPath, drop) {
  const moved = getItemByPath(fromPath); const targetPath = drop.element.dataset.path.split('.').map(Number); const target = getItemByPath(targetPath);
  if (!moved || !target || moved === target || dragState.element.contains(drop.element) || isReferenceRootPath(targetPath)) return;
  const openItems = getOpenItemRefs(); getItemsArrayByPath(fromPath.slice(0,-1)).splice(fromPath.at(-1),1);
  const path = findItemPath(target); if (!path) return;
  if (drop.mode === 'inside') { target.children ||= []; target.children.push(moved); }
  else { const siblings = getItemsArrayByPath(path.slice(0,-1)); siblings.splice(path.at(-1) + (drop.mode === 'after' ? 1 : 0), 0, moved); }
  saveAndRender(renderAccordion, openItems);
}

function startDrag() {
  if (!dragState.pending || !dragState.header || !dragState.element) return;

  dragState.active = true;
  dragState.suppressClick = true;

  dragState.element.style.opacity = '0.6';
  dragState.element.style.outline = '2px dashed #60a5fa';
  dragState.element.style.background = '#eff6ff';
}

function cancelDragState() {
  if (dragState.longPressTimer) {
    clearTimeout(dragState.longPressTimer);
    dragState.longPressTimer = null;
  }

  dragState.pending = false;
  dragState.active = false;
  dragState.path = null;
  dragState.header = null;
  dragState.element = null;
  dragState.parentEl = null;
  dragState.pointerId = null;
  dragState.startX = 0;
  dragState.startY = 0;
  dragState.dropTarget = null;
  clearDragHoverTimer();
}

function onGlobalPointerMove(e) {
  if (dragState.pending && !dragState.active) {
    const dx = Math.abs(e.clientX - dragState.startX);
    const dy = Math.abs(e.clientY - dragState.startY);

    if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
      if (dragState.longPressTimer) {
        clearTimeout(dragState.longPressTimer);
        dragState.longPressTimer = null;
      }
      dragState.pending = false;
    }
    return;
  }

  if (!dragState.active) return;
  if (e.pointerId !== dragState.pointerId) return;

  e.preventDefault();

  const draggingEl = dragState.element;
  if (!draggingEl) return;
  const parentItem = dragState.parentEl?.closest('.accordion-item');
  if (parentItem && dragState.path?.length > 1) { const r=parentItem.getBoundingClientRect(); if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){parentItem.querySelector(':scope > .accordion-header')?.classList.remove('active');parentItem.querySelector(':scope > .accordion-content')?.classList.remove('open');} }

  const path = target.dataset.path.split('.').map(Number); if (isReferenceRootPath(path)) return;

  const position=(e.clientY-rect.top)/rect.height;

function endDrag(e) {
  if (dragState.pending && !dragState.active) {
    if (dragState.longPressTimer) {
      clearTimeout(dragState.longPressTimer);
      dragState.longPressTimer = null;
    }
    cancelDragState();
    return;
  }

  if (!dragState.active) return;
  if (e && e.pointerId !== dragState.pointerId) return;

  const originalPath = dragState.path ? [...dragState.path] : null;

  if (dragState.dropTarget && originalPath) {
    clearDragStyles();
    moveItemToDropTarget(originalPath, dragState.dropTarget);
  } else {
    clearDragStyles();
  }

  cancelDragState();

// 전역 포인터 이벤트는 한 번만 등록

// ==================== 아코디언 헤더 색상 ====================
const ACCORDION_HEADER_BASE_COLOR = [95, 114, 145];
const ACCORDION_HEADER_LIGHTEN_STEP = -0.2;
const ACCORDION_HEADER_MAX_LIGHTEN = 0.8;
const REFERENCE_HEADER_COLOR = [63, 124, 104];
const DESCRIPTION_HEADER_COLOR = [116, 99, 149];

function mixRgb(from, to, amount) {
  return from.map((value, idx) => Math.round(value + (to[idx] - value) * amount));
}

function rgbToCss(rgb) {
  return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
}

function applyHeaderDepthColor(header, depth) {
  const lightenAmount = Math.min(depth * ACCORDION_HEADER_LIGHTEN_STEP, ACCORDION_HEADER_MAX_LIGHTEN);
  const bg = mixRgb(ACCORDION_HEADER_BASE_COLOR, [255, 255, 255], lightenAmount);
  const hoverBg = mixRgb(bg, [0, 0, 0], 0.18);

  header.style.setProperty('--accordion-header-bg', rgbToCss(bg));
  header.style.setProperty('--accordion-header-hover-bg', rgbToCss(hoverBg));
}

function applySpecialHeaderTheme(header, path) {
  const rootItem = manualData.menu?.[path[0]];

  let themeColor = null;
  if (isReferenceSection(rootItem)) {
    themeColor = REFERENCE_HEADER_COLOR;
  } else if (isDescriptionSection(rootItem)) {
    themeColor = DESCRIPTION_HEADER_COLOR;
  }

  if (!themeColor) return;

  const depthAmount = Math.min((path.length - 1) * 0.16, 0.46);
  const bg = mixRgb(themeColor, [255, 255, 255], depthAmount);
  header.style.setProperty('--accordion-header-bg', rgbToCss(bg));
  header.style.setProperty('--accordion-header-hover-bg', rgbToCss(mixRgb(bg, [0, 0, 0], 0.18)));
}

// ==================== 아코디언 아이템 생성 ====================
function appendDomButton(parent, { text, className = '', title = '', onClick }) {

  if (title) button.title = title;
  if (onClick) button.addEventListener('click', onClick);
  parent.appendChild(button);

}

function createTableElement(table, path, tableIndex) {

    appendDomButton(toolbar, { text: '행 삭제', onClick: () => removeTableRow(path, tableIndex) });
    appendDomButton(toolbar, { text: '열 추가', onClick: () => addTableCol(path, tableIndex) });
    appendDomButton(toolbar, { text: '열 삭제', onClick: () => removeTableCol(path, tableIndex) });
    appendDomButton(toolbar, { text: '표 삭제', className: 'table-delete-btn', onClick: () => deleteTable(path, tableIndex) });
    wrap.appendChild(toolbar);
  }

  const tableEl = document.createElement('table');
  tableEl.className = 'manual-table';
  tableEl.dataset.tableIndex = tableIndex;
  const spannedCells = new Set();

  table.cells.forEach((row, rowIndex) => {
    const tr = document.createElement('tr');
    row.forEach((cellText, colIndex) => {
      if (spannedCells.has(getTableCellKey(rowIndex, colIndex))) return;

      const span = getTableCellSpan(table, rowIndex, colIndex);
      const cell = document.createElement('td');
      cell.dataset.rowIndex = rowIndex;
      cell.dataset.colIndex = colIndex;
      if (span.rowspan > 1) cell.rowSpan = span.rowspan;
      if (span.colspan > 1) cell.colSpan = span.colspan;
      applyTableCellStyle(cell, table.cellColors[rowIndex][colIndex]);

      const coveredRows = Math.min(span.rowspan, table.rows - rowIndex);
      const coveredCols = Math.min(span.colspan, table.cols - colIndex);
      for (let rowOffset = 0; rowOffset < coveredRows; rowOffset++) {
        for (let colOffset = 0; colOffset < coveredCols; colOffset++) {
          if (rowOffset === 0 && colOffset === 0) continue;
          spannedCells.add(getTableCellKey(rowIndex + rowOffset, colIndex + colOffset));
        }
      }

      if (currentMode === 'edit') {
        const textEditor = document.createElement('div');
        textEditor.className = 'manual-table-cell-text';
        textEditor.dataset.imageEditor = 'true';
        textEditor.contentEditable = "true";
        renderContentWithImages(textEditor, cellText, table.cellImages[rowIndex][colIndex], true);
        textEditor.addEventListener('input', event => {
          applyTableCellStyle(cell, table.cellColors[rowIndex][colIndex]);
          const saved = serializeContentWithImages(textEditor, table.cellImages[rowIndex][colIndex]);
          table.cells[rowIndex][colIndex] = saved.text;
          table.cellImages[rowIndex][colIndex] = saved.images;
          saveToLocalStorage();
          if (!event.isComposing) refreshEditableMarkdown(textEditor, saved.text, saved.images);
        });
        bindReferenceAutocomplete(textEditor, () => addTableCellImage(path, tableIndex, rowIndex, colIndex, textEditor));
        cell.appendChild(textEditor);
        cell.addEventListener('pointerdown', event => {
          if (event.button !== 2) return;
          clearTableSelection();
          tableSelection.active = true;
          tableSelection.path = [...path];
          tableSelection.tableIndex = tableIndex;
          tableSelection.start = { row: rowIndex, col: colIndex };
          updateTableSelection(cell);
        });
        cell.addEventListener('pointerenter', () => {
          if (tableSelection.active && tableSelection.path?.join('.') === path.join('.') && tableSelection.tableIndex === tableIndex) updateTableSelection(cell);
        });
        cell.addEventListener('contextmenu', event => {
          tableSelection.active = false;
          showTableCellContextMenu(event, cell, path, tableIndex, rowIndex, colIndex);
        });
      } else {
        renderContentWithImages(cell, cellText, table.cellImages[rowIndex][colIndex]);
      }
      tr.appendChild(cell);
    });
    tableEl.appendChild(tr);
  });

  wrap.appendChild(tableEl);
  return wrap;
}

function createItem(item, path) {
  const isReferenceRoot = isReferenceRootPath(path);
  const isReferenceEntry = isReferenceEntryPath(path);
  const itemDiv = document.createElement('div');
  itemDiv.className = 'accordion-item';
  itemDiv.dataset.path = path.join('.');

  const header = document.createElement('div');
  header.className = 'accordion-header';
  applyHeaderDepthColor(header, path.length - 1);
  applySpecialHeaderTheme(header, path);

  const titleSpan = document.createElement('span');
  titleSpan.textContent = item.title;
  header.appendChild(titleSpan);

  if (currentMode === 'edit') {
    const buttonContainer = document.createElement('div');
    buttonContainer.className = 'edit-btn-container';

    if (!isReferenceRoot) {
      appendDomButton(buttonContainer, { text: '제목 수정', className: 'action-btn btn-edit', onClick: () => editItemTitle(path) });
      appendDomButton(buttonContainer, { text: '표 추가', className: 'action-btn btn-add', onClick: () => addTable(path) });
    }
    if (!isReferenceEntry) {
      appendDomButton(buttonContainer, { text: '하위 항목 추가', className: 'action-btn btn-add', onClick: () => addChildItem(path) });
    }
    if (!isReferenceRoot) {
      appendDomButton(buttonContainer, { text: '삭제', className: 'action-btn btn-delete', onClick: () => deleteItem(path) });
      const insertButtons = document.createElement('div');
      insertButtons.className = 'insert-btn';
      appendDomButton(insertButtons, { text: '위 항목 추가', className: 'action-btn btn-insert-above', title: '현재 항목 위에 추가', onClick: () => insertItemAbove(path) });
      appendDomButton(insertButtons, { text: '아래 항목 추가', className: 'action-btn btn-insert-below', title: '현재 항목 아래에 추가', onClick: () => insertItemBelow(path) });
      buttonContainer.appendChild(insertButtons);
    }

    header.appendChild(buttonContainer);
  }

  const contentDiv = document.createElement('div');
  contentDiv.className = 'accordion-content';

  const contentText = item.content || '';
  const itemImages = ensureItemImages(item);
  const hasVisibleContent = contentText.trim().length > 0;
  const hasVisibleImages = itemImages.length > 0;

  if (hasVisibleContent || hasVisibleImages || currentMode === 'edit' || item.content) {
    const pre = document.createElement('pre');
    if (currentMode === 'edit') {
      pre.contentEditable = "true";
      pre.dataset.imageEditor = 'true';
      const images = itemImages;
      renderContentWithImages(pre, contentText, images, true);
      pre.addEventListener('click', (e) => e.stopPropagation());
      pre.addEventListener('pointerdown', (e) => e.stopPropagation());
      pre.addEventListener('input', event => {
        const targetItem = getItemByPath(path);
        const saved = serializeContentWithImages(pre, ensureItemImages(targetItem));
        targetItem.content = saved.text;
        targetItem.images = saved.images;
        saveToLocalStorage();
        if (!event.isComposing) refreshEditableMarkdown(pre, saved.text, saved.images);
      });
      bindReferenceAutocomplete(pre, () => addItemImage(path, pre));
    } else {
      pre.contentEditable = "false";
      renderContentWithImages(pre, contentText, itemImages);
      if (!hasVisibleContent && !hasVisibleImages) pre.style.display = 'none';
    }
    contentDiv.appendChild(pre);
  }

  ensureItemTables(item).forEach((table, tableIndex) => {
    contentDiv.appendChild(createTableElement(table, path, tableIndex));
  });

  if (item.children && item.children.length > 0) {
    const subContainer = document.createElement('div');
    item.children.forEach((child, idx) => {
      subContainer.appendChild(createItem(child, [...path, idx]));
    });
    contentDiv.appendChild(subContainer);
  }

  // 클릭 이벤트 - 모든 계층에 동일하게 적용 (같은 레벨 하나만 열림)
  header.addEventListener('click', (e) => {
    if (dragState.suppressClick) {
      e.preventDefault();
      e.stopPropagation();
      dragState.suppressClick = false;
      return;
    }

    if (currentMode === 'edit' && e.target.tagName === 'BUTTON') return;

    const isCurrentlyOpen = contentDiv.classList.contains('open');

    if (isCurrentlyOpen) {
      // 열린 상태에서 클릭 → 닫기
      contentDiv.classList.remove('open');
      header.classList.remove('active');
      closeAllChildren(contentDiv);  // 하위 모두 닫기
    } else {
      // 닫힌 상태에서 클릭 → 열기
      closeSiblings(contentDiv);     // 같은 레벨 다른 항목 모두 닫기
      contentDiv.classList.add('open');
      header.classList.add('active');
    }
  });

  // 수정 모드에서 헤더를 길게 누르면 같은 계층 내 이동 가능
  header.addEventListener('pointerdown', (e) => {
    if (currentMode !== 'edit') return;
    if (e.target.tagName === 'BUTTON') return;
    if (isReferenceRoot) return;

    dragState.pending = true;
    dragState.active = false;
    dragState.path = [...path];
    dragState.header = header;
    dragState.element = itemDiv;
    dragState.parentEl = itemDiv.parentElement;
    dragState.pointerId = e.pointerId;
    dragState.startX = e.clientX;
    dragState.startY = e.clientY;
    dragState.suppressClick = false;

    if (dragState.longPressTimer) clearTimeout(dragState.longPressTimer);

    dragState.longPressTimer = setTimeout(() => {
      startDrag();
    }, LONG_PRESS_DELAY);
  });

  header.addEventListener('pointerup', () => {
    if (dragState.longPressTimer) {
      clearTimeout(dragState.longPressTimer);
      dragState.longPressTimer = null;
    }

    if (dragState.pending && !dragState.active) {
      cancelDragState();
    }
  });

  header.addEventListener('pointercancel', () => {
    if (dragState.longPressTimer) {
      clearTimeout(dragState.longPressTimer);
      dragState.longPressTimer = null;
    }
    clearDragStyles();
    cancelDragState();
  });

  header.addEventListener('contextmenu', (e) => {
    if (currentMode === 'edit') {
      e.preventDefault();
    }
  });

  itemDiv.appendChild(header);
  itemDiv.appendChild(contentDiv);
  return itemDiv;
}

const manualSearchState = { query: '', results: [], currentIndex: -1 };
let manualSearchTimer = null;
const highlightedSearchRoots = new Set();
let currentSearchHeader = null;
function getItemDirectSearchParts(item) {
  return [item.title, item.content, ...ensureItemTables(item).flatMap(t => t.cells.flat())].map(value => String(value || ''));
}
function getReferenceTokenNames(text) {
  const names = [];
  String(text || '').replace(/{{\s*([^{}]+?)\s*}}/g, (match, referenceName) => {
    const name = referenceName.trim();
    if (name) names.push(name);
    return match;
  });
  return names;
}
function getItemSearchText(item, referenceMap = getReferenceMap(), seenReferences = new Set()) {
  const directParts = getItemDirectSearchParts(item);
  const referencedParts = [];
  directParts.forEach(part => {
    getReferenceTokenNames(part).forEach(name => {
      if (seenReferences.has(name)) return;
      const reference = referenceMap.get(name);
      if (!reference) return;
      const nextSeen = new Set(seenReferences);
      nextSeen.add(name);
      referencedParts.push(getItemSearchText(reference, referenceMap, nextSeen));
    });
  });
  return [...directParts, ...referencedParts].join('\n');
}
function searchText(item, referenceMap = getReferenceMap()) { return getItemSearchText(item, referenceMap).toLocaleLowerCase('ko'); }
function findSearchResults(query) { const out=[]; const normalizedQuery=query.toLocaleLowerCase('ko'); const referenceMap=getReferenceMap(); const walk=(items,path=[])=>items.forEach((item,i)=>{const next=[...path,i]; if(searchText(item,referenceMap).includes(normalizedQuery)) out.push(next); walk(item.children||[],next);}); walk(manualData.menu||[]); return out; }
function clearSearchHighlights() { highlightedSearchRoots.forEach(root=>root.querySelectorAll('mark.search-highlight').forEach(mark=>mark.replaceWith(document.createTextNode(mark.textContent)))); highlightedSearchRoots.clear(); currentSearchHeader?.classList.remove('search-current'); currentSearchHeader=null; }
function highlightSearchText(element, query) { if (!element) return; highlightedSearchRoots.add(element); const re=new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'); const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) { const node=walker.currentNode; const owner=node.parentElement.closest('.accordion-item'); if(node.nodeValue.trim()&&!node.parentElement.closest('button,mark')&&(!owner||owner===element)) nodes.push(node); } nodes.forEach(node=>{const parts=node.nodeValue.split(re);if(parts.length===1)return;const f=document.createDocumentFragment();parts.forEach((part,i)=>{if(!part)return;if(i%2){const mark=document.createElement('mark');mark.className='search-highlight';mark.textContent=part;f.appendChild(mark);}else f.appendChild(document.createTextNode(part));});node.replaceWith(f);}); }
function updateSearchCount() { const count=document.getElementById('manual-search-count'); if(!count)return; count.textContent=!manualSearchState.query?'검색어를 입력하세요.':!manualSearchState.results.length?'검색 결과가 없습니다.':`${manualSearchState.currentIndex+1} / ${manualSearchState.results.length}개 항목`; }
function nearestSearchIndex() { const items=Array.from(document.querySelectorAll('.accordion-item')); const open=items.filter(el=>el.querySelector(':scope > .accordion-content.open')).map(el=>items.indexOf(el)); if(!open.length)return 0; let best=0,dist=Infinity;manualSearchState.results.forEach((path,i)=>{const n=items.indexOf(document.querySelector(`.accordion-item[data-path="${path.join('.')}"]`));const d=Math.min(...open.map(v=>Math.abs(v-n)));if(d<dist){best=i;dist=d;}});return best; }
function highlightCurrentSearchResult() { clearSearchHighlights(); if(manualSearchState.query) highlightSearchText(document.getElementById('global-content'),manualSearchState.query); const path=manualSearchState.results[manualSearchState.currentIndex]; if(!path)return;const item=getAccordionElement(path); if(item){highlightSearchText(item,manualSearchState.query);currentSearchHeader=item.querySelector(':scope > .accordion-header');currentSearchHeader?.classList.add('search-current');} }
function openSearchResult() { const path=manualSearchState.results[manualSearchState.currentIndex];if(!path)return;document.querySelectorAll('.accordion-content.open').forEach(e=>e.classList.remove('open'));document.querySelectorAll('.accordion-header.active').forEach(e=>e.classList.remove('active'));for(let d=1;d<=path.length;d++){const item=document.querySelector(`.accordion-item[data-path="${path.slice(0,d).join('.')}"]`);item?.querySelector(':scope > .accordion-header')?.classList.add('active');item?.querySelector(':scope > .accordion-content')?.classList.add('open');}highlightCurrentSearchResult();document.querySelector(`.accordion-item[data-path="${path.join('.')}"]`)?.querySelector(':scope > .accordion-header')?.scrollIntoView({behavior:'smooth',block:'center'});updateSearchCount(); }
function applyManualSearch(openCurrent=false) { const input=document.getElementById('manual-search-input');manualSearchState.query=(input?.value||'').trim();manualSearchState.results=manualSearchState.query?findSearchResults(manualSearchState.query):[];manualSearchState.currentIndex=manualSearchState.results.length?(openCurrent?nearestSearchIndex():Math.min(Math.max(manualSearchState.currentIndex,0),manualSearchState.results.length-1)):-1;highlightCurrentSearchResult();updateSearchCount();if(openCurrent&&manualSearchState.currentIndex>=0)openSearchResult(); }
function moveSearchResult(step) { if(!manualSearchState.results.length)return;manualSearchState.currentIndex=(manualSearchState.currentIndex+step+manualSearchState.results.length)%manualSearchState.results.length;openSearchResult(); }

// ==================== 편집 관련 함수들 ====================
function getOpenItemPaths() {
  return Array.from(document.querySelectorAll('.accordion-item'))
    .filter(item => item.querySelector(':scope > .accordion-content')?.classList.contains('open'))
    .map(item => item.dataset.path.split('.').map(Number));

function reopenExistingPaths(paths) {
  paths.forEach(path => {
    try {
      if (getItemByPath(path)) reopenPath(path);
    } catch (error) {
      // 되돌린 상태에 더 이상 없는 경로는 열지 않습니다.
    }
  });
}

function undoLastEdit() {
  if (currentMode !== 'edit' || editHistoryState.undoStack.length === 0) return;

  const openPaths = getOpenItemPaths();
  const previousSnapshot = editHistoryState.undoStack.pop();
  manualData = JSON.parse(previousSnapshot);
  ensureSystemSections();
  normalizeAllTables();
  editHistoryState.currentSnapshot = JSON.stringify(manualData);
  saveToLocalStorage(true);
  renderAll();
  reopenExistingPaths(openPaths);
}

function toggleMode() {
  const openItems = getOpenItemRefs();

  if (currentMode === 'edit') {
    const manualName = document.getElementById('manual-name');
    const globalContent = document.getElementById('global-content');
    manualData.manualName = manualName.textContent.trim() || DEFAULT_MANUAL_NAME;
    const savedGlobal = serializeContentWithImages(globalContent, manualData.globalImages);
    manualData.globalManual = savedGlobal.text;
    manualData.globalImages = savedGlobal.images;
    renameActiveStorageKeyForManualName();
  }
  
  currentMode = currentMode === 'read' ? 'edit' : 'read';
  renderAll();
  reopenItemRefs(openItems);
}

function editItemTitle(path) {
  if (isReferenceRootPath(path)) return;
  const item = getItemByPath(path);
  const title = prompt("수정할 제목을 입력하세요.", item.title);
  if (!title || !title.trim()) return;

  item.title = title.trim();
  saveAndRender();
}

function insertSiblingItem(path, offset, promptMessage) {
  if (isReferenceRootPath(path)) return;
  const title = prompt(promptMessage);
  if (!title || !title.trim()) return;

  const openItems = getOpenItemRefs();
  const lastIndex = path[path.length - 1];
  getSiblingArrayByPath(path).splice(lastIndex + offset, 0, createEmptyItem(title));
  saveAndRender(renderAccordion, openItems);
}

function insertItemAbove(path) {
  insertSiblingItem(path, 0, "위에 추가할 메뉴 제목을 입력하세요:");
}

function insertItemBelow(path) {
  insertSiblingItem(path, 1, "아래에 추가할 메뉴 제목을 입력하세요:");
}

function addChildItem(path) {
  if (isReferenceEntryPath(path)) {
    alert("참조 하위항목 안에는 추가 하위항목을 만들 수 없습니다.");
    return;
  }

  const title = prompt("하위 메뉴 제목을 입력하세요:");
  if (!title?.trim()) return;

  const openItems = getOpenItemRefs();
  getItemsArrayByPath(path).push(createEmptyItem(title));
  saveAndRender(renderAccordion, openItems);
}

function deleteItem(path) {
  if (isReferenceRootPath(path)) {
    alert("참조 항목은 삭제할 수 없습니다.");
    return;
  }

  if (!confirm("이 항목과 모든 하위 내용을 삭제하시겠습니까?")) return;

  const openItems = getOpenItemRefs();
  getSiblingArrayByPath(path).splice(path[path.length - 1], 1);
  saveAndRender(renderAccordion, openItems);
}

function exportBackup() {
